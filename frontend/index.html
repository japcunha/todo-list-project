<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,900&display=swap"
        rel="stylesheet">

    <title>To Do List</title>
</head>

<body>
    <main>

        <h1>Lista de Tarefas</h1>
        <br>

        <form class="add-form">
            <input type="text" placeholder="Adicionar tarefa" class="input-task">
            <button type="submit">+</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Criada em</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>título da task</td>
                    <td>11 de abril de 2025 16:00</td>
                    <td>
                        <select>
                            <option value="pendente">pendente</option>
                            <option value="em andamento">em andamento</option>
                            <option value="concluída">concluída</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-action">
                            <span class="material-symbols-outlined">edit</span>
                        </button>

                        <button class="btn-action">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </td>
                </tr>
            </tbody>


        </table>

    </main>

    <script src="script.js"></script>
</body>

</html>
